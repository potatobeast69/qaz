  # Job 5: Проверка утечек памяти
  memory-check:
    name: 💾 Проверка утечек памяти
    needs: setup-tools
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout кода
        uses: actions/checkout@v4

      - name: 📥 Загрузка инструментов
        uses: actions/download-artifact@v4
        with:
          name: code-review-tools
          path: tools

      - name: 💾 Запуск проверки памяти
        id: memory-check
        continue-on-error: true
        run: |
          if [ -f "tools/swift-memory-check" ]; then
            chmod +x tools/swift-memory-check
            tools/swift-memory-check . --static-analysis --format json --output memory-report.json || true
          else
            echo "⚠️ swift-memory-check не найден"
            echo "⚠️ Проверка памяти пропущена - требуется инструмент из репозитория"
            echo '{"summary":{"errors":0,"warnings":0,"infos":0},"issues":[]}' > memory-report.json
          fi

      - name: 📊 Результаты проверки памяти
        if: always()
        run: |
          if [ -f "memory-report.json" ]; then
            echo "📄 Отчет создан"
            cat memory-report.json | jq '.summary'

            MEMORY_ERRORS=$(cat memory-report.json | jq '.summary.errors')
            MEMORY_WARNINGS=$(cat memory-report.json | jq '.summary.warnings')

            echo "❌ Ошибок: $MEMORY_ERRORS"
            echo "⚠️ Предупреждений: $MEMORY_WARNINGS"

            echo "MEMORY_ERRORS=$MEMORY_ERRORS" >> $GITHUB_ENV
            echo "MEMORY_WARNINGS=$MEMORY_WARNINGS" >> $GITHUB_ENV
          else
            echo "⚠️ Отчет не создан"
          fi

      - name: 💾 Сохранение отчета
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-report
          path: memory-report.json
          if-no-files-found: ignore

  # Job 6: Сводный отчет и отправка на backend
  final-report:
    name: 📊 Сводный отчет
    needs: [build-check, style-check, memory-check]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 📥 Checkout кода
        uses: actions/checkout@v4

      - name: 📥 Загрузка всех отчетов
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: 📊 Создание сводного отчета
        run: |
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║          📊 СВОДНЫЙ ОТЧЕТ CODE REVIEW                  ║"
          echo "╚════════════════════════════════════════════════════════╝"
          echo ""
          echo "📌 Репозиторий: ${{ github.repository }}"
          echo "🔀 Ветка: ${{ github.ref_name }}"
          echo "👤 Автор: ${{ github.actor }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo ""

          # Статус сборки
          if [ "${{ needs.build-check.outputs.build-status }}" == "success" ]; then
            echo "✅ 🔨 Сборка: УСПЕШНО"
          else
            echo "❌ 🔨 Сборка: ПРОВАЛЕНА"
          fi

          # Проверка стиля
          if [ -f "reports/style-report/style-report.json" ]; then
            STYLE_ERRORS=$(cat reports/style-report/style-report.json | jq -r '.summary.errors // 0')
            STYLE_WARNINGS=$(cat reports/style-report/style-report.json | jq -r '.summary.warnings // 0')
            echo "🎨 Стиль кода: $STYLE_ERRORS ошибок, $STYLE_WARNINGS предупреждений"
          else
            echo "⚠️ 🎨 Стиль кода: отчет недоступен"
          fi

          # Мертвый код
          if [ -f "reports/dead-code-report/dead-code-report.json" ]; then
            DEAD_CODE=$(cat reports/dead-code-report/dead-code-report.json | jq -r '.summary.warnings // 0')
            echo "🗑️ Неиспользуемый код: $DEAD_CODE элементов"
          else
            echo "⚠️ 🗑️ Неиспользуемый код: отчет недоступен"
          fi

          # Утечки памяти
          if [ -f "reports/memory-report/memory-report.json" ]; then
            MEM_ERRORS=$(cat reports/memory-report/memory-report.json | jq -r '.summary.errors // 0')
            MEM_WARNINGS=$(cat reports/memory-report/memory-report.json | jq -r '.summary.warnings // 0')
            echo "💾 Утечки памяти: $MEM_ERRORS ошибок, $MEM_WARNINGS предупреждений"
          else
            echo "⚠️ 💾 Утечки памяти: отчет недоступен"
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 📤 Подготовка JSON для отправки на backend
        id: prepare-json
        run: |
          # Создаем JSON со всеми результатами
          cat > final-report.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "author": "${{ github.actor }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "build_status": "${{ needs.build-check.outputs.build-status }}",
            "reports": {
              "style": $(cat reports/style-report/style-report.json 2>/dev/null || echo 'null'),
              "dead_code": $(cat reports/dead-code-report/dead-code-report.json 2>/dev/null || echo 'null'),
              "memory": $(cat reports/memory-report/memory-report.json 2>/dev/null || echo 'null')
            }
          }
          EOF

          echo "📄 JSON отчет создан:"
          cat final-report.json | jq '.'

      - name: 📤 Отправка на backend (TODO)
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📤 ОТПРАВКА НА BACKEND"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "⚠️ Backend URL не настроен"
          echo ""
          echo "💡 Чтобы отправлять результаты на ваш backend:"
          echo "   1. Добавьте secret BACKEND_URL в настройках репозитория"
          echo "   2. Раскомментируйте код ниже"
          echo ""
          echo "Пример кода для отправки:"
          echo "  curl -X POST \$BACKEND_URL \\"
          echo "    -H 'Content-Type: application/json' \\"
          echo "    -d @final-report.json"
          echo ""

          # TODO: Раскомментируйте когда backend будет готов
          # if [ -n "${{ secrets.BACKEND_URL }}" ]; then
          #   curl -X POST ${{ secrets.BACKEND_URL }} \
          #     -H "Content-Type: application/json" \
          #     -H "Authorization: Bearer ${{ secrets.BACKEND_TOKEN }}" \
          #     -d @final-report.json
          # fi

      - name: 💾 Сохранение финального отчета
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: final-report.json
