name: 🔍 Code Review & Build Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Job 1: Проверка компиляции
  build-check:
    name: 🔨 Проверка компиляции
    runs-on: macos-latest
    timeout-minutes: 20
    outputs:
      build-status: ${{ steps.build.outcome }}

    steps:
      - name: 📥 Checkout кода
        uses: actions/checkout@v4

      - name: 💾 Кеш SPM зависимостей
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: 📋 Информация о среде
        run: |
          echo "Xcode: $(xcodebuild -version)"
          echo "Swift: $(swift --version)"
          echo "macOS: $(sw_vers -productVersion)"

      - name: 🔨 Сборка проекта
        id: build
        continue-on-error: true
        run: |
          if [ -f "Package.swift" ]; then
            echo "📦 Swift Package обнаружен"
            swift build
          elif find . -maxdepth 1 -name "*.xcworkspace" | grep -q .; then
            WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
            WORKSPACE_NAME=$(basename "$WORKSPACE")
            SCHEME=$(xcodebuild -workspace "$WORKSPACE_NAME" -list | grep -A 1 "Schemes:" | tail -n 1 | xargs)
            echo "🔨 Собираю workspace: $WORKSPACE_NAME, схема: $SCHEME"
            xcodebuild -workspace "$WORKSPACE_NAME" -scheme "$SCHEME" \
              -destination "platform=iOS Simulator,name=iPhone 16" \
              -configuration Debug clean build
          elif find . -maxdepth 1 -name "*.xcodeproj" | grep -q .; then
            PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
            PROJECT_NAME=$(basename "$PROJECT")
            SCHEME=$(xcodebuild -project "$PROJECT_NAME" -list | grep -A 1 "Schemes:" | tail -n 1 | xargs)
            echo "🔨 Собираю проект: $PROJECT_NAME, схема: $SCHEME"
            xcodebuild -project "$PROJECT_NAME" -scheme "$SCHEME" \
              -destination "platform=iOS Simulator,name=iPhone 16" \
              -configuration Debug clean build
          else
            echo "❌ Swift проект не найден"
            exit 1
          fi

      - name: 📊 Результат сборки
        run: |
          if [ "${{ steps.build.outcome }}" == "success" ]; then
            echo "✅ Проект успешно скомпилирован!"
          else
            echo "❌ Ошибка компиляции!"
            exit 1
          fi

  # Job 2: Клонирование Code Review Tools
  setup-tools:
    name: 🛠️ Подготовка инструментов
    needs: build-check
    if: needs.build-check.outputs.build-status == 'success'
    runs-on: macos-latest

    steps:
      - name: 📥 Клонирование Code Review Tools
        run: |
          git clone https://github.com/${{ github.repository_owner }}/mesimtesto.git tools
          cd tools
          echo "✅ Инструменты клонированы"

      - name: 🔨 Сборка Code Review Tools
        run: |
          cd tools
          swift build -c release
          echo "✅ Инструменты собраны"

      - name: 💾 Сохранение собранных инструментов
        uses: actions/upload-artifact@v4
        with:
          name: code-review-tools
          path: tools/.build/release/
          retention-days: 1

  # Job 3: Проверка стиля кода (SwiftLint)
  style-check:
    name: 🎨 Проверка стиля кода
    needs: setup-tools
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout кода
        uses: actions/checkout@v4

      - name: 📥 Загрузка инструментов
        uses: actions/download-artifact@v4
        with:
          name: code-review-tools
          path: tools

      - name: 🔧 Установка SwiftLint
        run: |
          brew install swiftlint
          echo "SwiftLint версия: $(swiftlint version)"

      - name: 🎨 Запуск проверки стиля
        id: style-check
        continue-on-error: true
        run: |
          # Инструменты находятся в корне tools/ после download-artifact
          if [ -f "tools/swift-style-check" ]; then
            chmod +x tools/swift-style-check
            tools/swift-style-check . --format json --output style-report.json || true
          else
            echo "⚠️ swift-style-check не найден, используем SwiftLint напрямую"
            swiftlint lint --reporter json > style-report-raw.json || true
            # Преобразуем в нужный формат
            echo '{"summary":{"errors":0,"warnings":0},"files":[]}' > style-report.json
          fi

      - name: 📊 Результаты проверки стиля
        if: always()
        run: |
          if [ -f "style-report.json" ]; then
            echo "📄 Отчет создан"
            cat style-report.json | jq '.summary'

            # Подсчет проблем
            ERRORS=$(cat style-report.json | jq '.summary.errors')
            WARNINGS=$(cat style-report.json | jq '.summary.warnings')

            echo "❌ Ошибок: $ERRORS"
            echo "⚠️ Предупреждений: $WARNINGS"

            # Сохраняем для отправки на backend
            echo "STYLE_ERRORS=$ERRORS" >> $GITHUB_ENV
            echo "STYLE_WARNINGS=$WARNINGS" >> $GITHUB_ENV
          else
            echo "⚠️ Отчет не создан"
          fi

      - name: 💾 Сохранение отчета
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-report
          path: style-report.json
          if-no-files-found: ignore

